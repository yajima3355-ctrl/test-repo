<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>東京秘密クリニック｜クマ取り LP ファーストビュー（A/B/C）</title>
  <style>
    :root{--bg:#f7f5f3;--card:#fff;--text:#1f1f1f;--muted:#666;--accent:#b45a6b}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    header{padding:24px 32px;display:flex;justify-content:space-between;align-items:center}
    h1{font-size:18px;margin:0;color:var(--muted);font-weight:600}
    main{max-width:1280px;margin:0 auto;padding:16px 24px 64px}
    .grid{display:grid;grid-template-columns:1fr;gap:24px}
    @media(min-width:1100px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.05);overflow:hidden;border:1px solid #eee}
    .card header{padding:16px 20px;border-bottom:1px solid #eee}
    .card h2{font-size:16px;margin:0}
    .frame{position:relative;padding-top:56.25%;background:#fafafa}
    .frame iframe,.frame img{position:absolute;inset:0;width:100%;height:100%;border:0}
    footer{padding:24px 32px;color:var(--muted);font-size:12px}
    .actions{display:flex;gap:12px;padding:12px 20px;border-top:1px solid #eee}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#333;text-decoration:none;font-weight:600}
    .btn:hover{border-color:#ccc}
  </style>
</head>
<body>
  <header>
    <h1>東京秘密クリニック｜クマ取り LP ファーストビュー プレビュー</h1>
  </header>
  <main>
    <div class="grid">
      <section class="card">
        <header><h2>A｜女性向け（症例写真あり）</h2></header>
        <div class="frame"><img src="./fv_A.svg" alt="FV A" /></div>
        <div class="actions">
          <a class="btn" href="./fv_A.svg" download>SVGをダウンロード</a>
        </div>
      </section>
      <section class="card">
        <header><h2>B｜女性向け（理想女性モデル）</h2></header>
        <div class="frame"><img src="./fv_B.svg" alt="FV B" /></div>
        <div class="actions">
          <a class="btn" href="./fv_B.svg" download>SVGをダウンロード</a>
        </div>
      </section>
      <section class="card">
        <header><h2>C｜男女共通（院長）</h2></header>
        <div class="frame"><img src="./fv_C.svg" alt="FV C" /></div>
        <div class="actions">
          <a class="btn" href="./fv_C.svg" download>SVGをダウンロード</a>
        </div>
      </section>
    </div>
  </main>
  <footer>
    素材は Google Drive 指定のものを使用。SVG内の画像参照は `../assets/*.jpg`。
  </footer>
</body>
</html>
