<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .headline { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; font-size: 64px; font-weight: 700; fill: #2a2a2a; }
      .brand { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; font-size: 20px; font-weight: 600; fill: #6b6b6b; letter-spacing: 0.08em; }
      .sub { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; font-size: 20px; font-weight: 500; fill: #4a4a4a; }
      .badge { fill: #ffffff; stroke: #e4dcd6; stroke-width: 1; }
      .badge-text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; font-size: 18px; fill: #333333; font-weight: 600; }
      .accent { fill: #b45a6b; }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <rect x="960" y="0" width="960" height="1080" fill="#f7f4f1"/>
  <image href="../assets/case1.jpg" x="0" y="0" width="960" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <text x="1040" y="100" class="brand">東京秘密クリニック</text>
  <text x="1040" y="280" class="headline">“疲れてる？”と言われない私へ。</text>
  <rect x="1040" y="320" width="360" height="6" class="accent"/>
  <text x="1040" y="380" class="sub">清潔感・上品さ・信頼感を重視したクマ取り</text>
  <g transform="translate(1040, 440)">
    <rect rx="24" ry="24" width="200" height="48" class="badge"/>
    <text x="20" y="31" class="badge-text">口コミ ★4.8</text>
  </g>
  <g transform="translate(1260, 440)">
    <rect rx="24" ry="24" width="180" height="48" class="badge"/>
    <text x="20" y="31" class="badge-text">院長が施術</text>
  </g>
  <g transform="translate(1450, 440)">
    <rect rx="24" ry="24" width="180" height="48" class="badge"/>
    <text x="20" y="31" class="badge-text">明朗会計</text>
  </g>
  <g opacity="0.6" transform="translate(960,1000)">
    <rect x="400" y="0" width="120" height="3" fill="#c0b8b1"/>
    <rect x="540" y="0" width="40" height="3" fill="#b45a6b"/>
  </g>
</svg>
