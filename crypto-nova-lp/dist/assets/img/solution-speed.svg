<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" rx="20" fill="url(#speedBg)"/>
  
  <!-- Central AI Brain -->
  <circle cx="150" cy="100" r="25" fill="url(#brainGradient)" stroke="#00FFFF" stroke-width="2"/>
  
  <!-- Neural Network -->
  <circle cx="100" cy="60" r="8" fill="url(#nodeGradient)">
    <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="60" r="8" fill="url(#nodeGradient)">
    <animate attributeName="r" values="8;6;8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="140" r="8" fill="url(#nodeGradient)">
    <animate attributeName="r" values="7;9;7" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="140" r="8" fill="url(#nodeGradient)">
    <animate attributeName="r" values="6;8;6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Speed Lines -->
  <path d="M50 100 L120 100" stroke="#FFD700" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M50 100 L120 100;M80 100 L150 100;M110 100 L180 100" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <path d="M50 90 L120 90" stroke="#00FFFF" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.6s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="d" values="M50 90 L120 90;M80 90 L150 90;M110 90 L180 90" dur="0.6s" repeatCount="indefinite" begin="0.1s"/>
  </path>
  <path d="M50 110 L120 110" stroke="#FFD700" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="d" values="M50 110 L120 110;M80 110 L150 110;M110 110 L180 110" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
  </path>
  
  <!-- Data Flow -->
  <circle cx="250" cy="100" r="2" fill="#00FFFF">
    <animate attributeName="cx" values="250;50;250" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="80" r="2" fill="#FFD700">
    <animate attributeName="cx" values="260;40;260" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="120" r="2" fill="#00FFFF">
    <animate attributeName="cx" values="240;60;240" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connections -->
  <path d="M100 60 L150 100" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.6"/>
  <path d="M200 60 L150 100" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.6"/>
  <path d="M80 140 L150 100" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.6"/>
  <path d="M220 140 L150 100" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.6"/>
  
  <!-- Speed Indicator -->
  <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFD700" text-anchor="middle">0.01s</text>
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="8" fill="#00FFFF" text-anchor="middle">AI PROCESSING</text>
  
  <!-- Circuit Pattern -->
  <path d="M20 20 L40 20 L40 40 L60 40" stroke="rgba(255, 215, 0, 0.3)" stroke-width="1" fill="none"/>
  <path d="M280 20 L260 20 L260 40 L240 40" stroke="rgba(0, 255, 255, 0.3)" stroke-width="1" fill="none"/>
  <path d="M20 180 L40 180 L40 160 L60 160" stroke="rgba(255, 215, 0, 0.3)" stroke-width="1" fill="none"/>
  <path d="M280 180 L260 180 L260 160 L240 160" stroke="rgba(0, 255, 255, 0.3)" stroke-width="1" fill="none"/>
  
  <defs>
    <linearGradient id="speedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(26, 26, 26, 0.9)"/>
      <stop offset="100%" style="stop-color:rgba(10, 10, 10, 0.9)"/>
    </linearGradient>
    
    <radialGradient id="brainGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFFF" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#FFD700" stop-opacity="0.3"/>
    </radialGradient>
    
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </radialGradient>
    
    <linearGradient id="connectionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF" stop-opacity="0.6"/>
      <stop offset="100%" style="stop-color:#FFD700" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>