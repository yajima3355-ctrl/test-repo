<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Device Frame -->
  <rect x="20" y="20" width="360" height="560" rx="40" fill="#1A1A1A" stroke="url(#deviceGradient)" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="40" y="80" width="320" height="480" rx="20" fill="#0A0A0A"/>
  
  <!-- Status Bar -->
  <rect x="50" y="90" width="300" height="20" fill="#2A2A2A" rx="10"/>
  <text x="60" y="102" font-family="Arial, sans-serif" font-size="8" fill="#FFD700">Crypto Nova</text>
  <text x="320" y="102" font-family="Arial, sans-serif" font-size="8" fill="#00FFFF">100%</text>
  
  <!-- Main Content Area -->
  <rect x="50" y="120" width="300" height="60" fill="url(#cardGradient)" rx="10"/>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Portfolio Balance</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFD700">$125,847.92</text>
  <text x="300" y="160" font-family="Arial, sans-serif" font-size="10" fill="#00FF88">+12.5%</text>
  
  <!-- Chart Area -->
  <rect x="50" y="190" width="300" height="120" fill="url(#chartGradient)" rx="10"/>
  <polyline points="60,280 80,260 100,240 120,220 140,200 160,210 180,190 200,200 220,180 240,170 260,160 280,150 300,140 320,130 340,120" 
            fill="none" stroke="#00FFFF" stroke-width="3"/>
  <circle cx="340" cy="120" r="4" fill="#FFD700"/>
  
  <!-- Trading Buttons -->
  <rect x="50" y="320" width="140" height="40" fill="url(#buyGradient)" rx="20"/>
  <text x="120" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A0A0A" text-anchor="middle">BUY</text>
  
  <rect x="210" y="320" width="140" height="40" fill="url(#sellGradient)" rx="20"/>
  <text x="280" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0A0A0A" text-anchor="middle">SELL</text>
  
  <!-- Recent Transactions -->
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Recent Transactions</text>
  
  <rect x="50" y="395" width="300" height="30" fill="rgba(255, 255, 255, 0.05)" rx="5"/>
  <text x="60" y="413" font-family="Arial, sans-serif" font-size="10" fill="#CCCCCC">BTC Purchase</text>
  <text x="320" y="413" font-family="Arial, sans-serif" font-size="10" fill="#00FF88">+0.025 BTC</text>
  
  <rect x="50" y="430" width="300" height="30" fill="rgba(255, 255, 255, 0.05)" rx="5"/>
  <text x="60" y="448" font-family="Arial, sans-serif" font-size="10" fill="#CCCCCC">ETH Sale</text>
  <text x="320" y="448" font-family="Arial, sans-serif" font-size="10" fill="#FF4444">-1.5 ETH</text>
  
  <rect x="50" y="465" width="300" height="30" fill="rgba(255, 255, 255, 0.05)" rx="5"/>
  <text x="60" y="483" font-family="Arial, sans-serif" font-size="10" fill="#CCCCCC">AI Auto Trade</text>
  <text x="320" y="483" font-family="Arial, sans-serif" font-size="10" fill="#00FF88">+$2,450</text>
  
  <!-- Navigation -->
  <rect x="50" y="520" width="300" height="30" fill="#2A2A2A" rx="15"/>
  <circle cx="90" cy="535" r="8" fill="#FFD700"/>
  <circle cx="150" cy="535" r="8" fill="#666666"/>
  <circle cx="210" cy="535" r="8" fill="#666666"/>
  <circle cx="270" cy="535" r="8" fill="#666666"/>
  <circle cx="330" cy="535" r="8" fill="#666666"/>
  
  <!-- Glow Effects -->
  <circle cx="200" cy="300" r="100" fill="url(#glowGradient)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="deviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#00FFFF"/>
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2A2A"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(0, 255, 255, 0.1)"/>
      <stop offset="100%" style="stop-color:rgba(0, 255, 255, 0.01)"/>
    </linearGradient>
    
    <linearGradient id="buyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#00DD77"/>
    </linearGradient>
    
    <linearGradient id="sellGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#CC3333"/>
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>