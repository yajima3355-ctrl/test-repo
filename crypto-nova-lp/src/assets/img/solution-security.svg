<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" rx="20" fill="url(#securityBg)"/>
  
  <!-- Central Shield -->
  <path d="M150 40l20 10 20-10v30c0 12.5-8.95 24.2-20 26.8C158.95 94.2 150 82.5 150 70V40z" fill="url(#shieldGradient)" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Quantum Particles -->
  <circle cx="100" cy="80" r="3" fill="#00FFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="3" fill="#FFD700" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="140" r="2" fill="#00FFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="60" r="2" fill="#FFD700" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection Lines -->
  <path d="M100 80 L150 67" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M200 120 L170 85" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M80 140 L130 85" stroke="url(#connectionGradient)" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Lock Icon in Shield -->
  <rect x="145" y="60" width="10" height="8" rx="2" fill="none" stroke="#0A0A0A" stroke-width="1"/>
  <circle cx="150" cy="64" r="2" fill="none" stroke="#0A0A0A" stroke-width="1"/>
  
  <!-- Encryption Text -->
  <text x="150" y="130" font-family="monospace" font-size="8" fill="#00FFFF" text-anchor="middle" opacity="0.7">01101001 11010011 10110101</text>
  <text x="150" y="145" font-family="monospace" font-size="8" fill="#FFD700" text-anchor="middle" opacity="0.5">11001010 01110110 10101100</text>
  
  <!-- Outer Protection Ring -->
  <circle cx="150" cy="100" r="80" fill="none" stroke="url(#ringGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="5,5">
    <animateTransform attributeName="transform" type="rotate" values="0 150 100;360 150 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <defs>
    <linearGradient id="securityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(26, 26, 26, 0.9)"/>
      <stop offset="100%" style="stop-color:rgba(10, 10, 10, 0.9)"/>
    </linearGradient>
    
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
    
    <linearGradient id="connectionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#00FFFF"/>
    </linearGradient>
  </defs>
</svg>